<article class="project-card">
  <a class="project-media" href="{{ site.baseurl}}{{ include.page.url }}" aria-label="{{ include.page.title }}">
    <img src="{{ site.baseurl }}/{{ include.page.image }}" alt="{{ include.page.title }}">
  </a>
  <div class="project-body">
    <div class="project-meta">
      <span>{{ include.page.date }}</span>
      {% if include.page.featured %}
        <span>Featured</span>
      {% endif %}
    </div>
    <h3>{{ include.page.title }}</h3>
    <p>{{ include.page.summary }}</p>
    <div class="pill-row">
      {% for label in include.page.labels %}
        <span class="badge">{{ label }}</span>
      {% endfor %}
    </div>
    <div class="project-actions">
      <a href="{{ site.baseurl}}{{ include.page.url }}" class="btn btn-outline-dark">Case Study</a>
      {% if include.page.projecturl %}
        <a href="{{ include.page.projecturl }}" class="text-link" target="_blank">Source</a>
      {% endif %}
    </div>
  </div>
</article>
